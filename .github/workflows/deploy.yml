name: Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: fitaccess-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: /root/nodejs_stuff/fitness-saas
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy app container
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
            -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          docker compose build fitaccess-app
          docker compose run --rm fitaccess-app npm run db:migrate
          docker compose up -d --no-deps fitaccess-app
          docker image prune -f
          REMOTE_SCRIPT
